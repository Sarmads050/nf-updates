name: Card image test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tasveerein banao aur check karo (koi post nahi)
        run: python tools/image_test.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Nateeja alag branch par (image-test)
        run: |
          git config user.name "nf-bot"; git config user.email "nf-bot@users.noreply.github.com"
          export GIT_INDEX_FILE=/tmp/idx
          git --work-tree=out add -A
          c=$(git commit-tree $(git write-tree) -m "image test")
          git push -f origin $c:refs/heads/image-test
