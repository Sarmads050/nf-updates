name: FB post count

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python tools/fb_count.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Nateeja branch par
        run: |
          git config user.name "nf-bot"; git config user.email "nf-bot@users.noreply.github.com"
          export GIT_INDEX_FILE=/tmp/idx
          git --work-tree=out add -A
          git push -f origin $(git commit-tree $(git write-tree) -m "fb count"):refs/heads/fb-count
