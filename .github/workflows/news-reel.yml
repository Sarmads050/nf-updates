name: News reel

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Waqt ka naam (bot khud bharta hai)"
        default: "manual"
      dry_run:
        description: "true = sirf Telegram par namoona, false = Facebook par Reel"
        default: "true"
      force_panel:
        description: "Test: is number ki khabar par tasveer ki jagah likhi khabar wala panel (0/1/2)"
        default: ""

permissions:
  contents: write

concurrency:
  group: news-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # hamesha taaza tareen state (qatar mein laga run purani state na parhe — warna post do dafa)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet -r requirements.txt numpy scipy pillow
      - name: Make reel
        run: python voice/reel.py
        env:
          TZ: Asia/Karachi
          REEL_DRY: ${{ github.event.inputs.dry_run || 'true' }}
          REEL_SLOT: ${{ github.event.inputs.slot }}
          REEL_FORCE_PANEL: ${{ github.event.inputs.force_panel }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Istemal hui khabrein yaad rakho
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.name "nf-updates-bot"
          git config user.email "nf-updates-bot@users.noreply.github.com"
          git add voice/reels.json
          git commit -m "reel used list [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 7; done
      - name: Frames check ke liye (reel-check branch)
        if: always()
        run: |
          git config user.name "nf-updates-bot"; git config user.email "nf-updates-bot@users.noreply.github.com"
          mkdir -p /tmp/rc && cp voice/out/frame*.jpg voice/out/reel.mp4 voice/out/reel_log.txt /tmp/rc/ 2>/dev/null || true
          ls /tmp/rc | grep -q . || exit 0
          export GIT_INDEX_FILE=/tmp/rcidx
          git --work-tree=/tmp/rc add -A
          c=$(git commit-tree $(git write-tree) -m "reel check")
          git push -f origin $c:refs/heads/reel-check
