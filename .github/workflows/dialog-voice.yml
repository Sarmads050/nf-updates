name: Dialog voices (cartoon)

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Dialog file name in voice/dialogs (without .json)"
        default: "behan_bhai"
      only:
        description: "Sirf yeh lines dobara banao (jaise 3,7). Khaali = sab"
        default: ""

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet requests numpy
      - name: Make voices
        run: python voice/dialog_tts.py "${{ inputs.name }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY_LINES: ${{ inputs.only }}
      - name: Save audio
        run: |
          git config user.name "nf-updates-bot"
          git config user.email "nf-updates-bot@users.noreply.github.com"
          git add voice/dialogs/out
          git commit -m "dialog voices [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
