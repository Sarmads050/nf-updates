name: NF Updates Autopost

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode: true = sirf Telegram par preview, false = asal posting"
        default: "true"

permissions:
  contents: write
  actions: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # hamesha taaza tareen state (qatar mein laga run purani state na parhe — warna post do dafa)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save state
        if: always()  # bot crash ho to bhi yaaddasht save ho (warna Telegram message dobara post hota)
        run: |
          git config user.name "nf-updates-bot"
          git config user.email "nf-updates-bot@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "state update [skip ci]"
              # Doosra run pehle save kar chuka ho to us ke upar apni state rakho (ye run zyada nayi hai)
              for i in 1 2 3; do
                git pull --rebase -X theirs origin main && git push && break
                sleep $((i * 5))
              done
            fi
          fi

      - name: Save Kawish e-paper (alag branch, aakhri 7 din)
        if: always()
        env:
          KEEP_DAYS: "7"
        run: |
          git config user.name "nf-updates-bot"
          git config user.email "nf-updates-bot@users.noreply.github.com"
          set -e
          if [ -d epaper ] && [ -n "$(ls -A epaper 2>/dev/null)" ]; then
            rm -rf /tmp/ep && mkdir -p /tmp/ep
            if git fetch -q origin kawish-epaper 2>/dev/null; then git archive FETCH_HEAD | tar -x -C /tmp/ep; fi
            cp -r epaper/* /tmp/ep/
            (cd /tmp/ep && ls -1d 20*/ 2>/dev/null | sort | head -n -${KEEP_DAYS:-7} | xargs -r rm -rf)
            export GIT_INDEX_FILE=/tmp/ep.index
            rm -f "$GIT_INDEX_FILE"
            git --work-tree=/tmp/ep add -A .
            TREE=$(git write-tree)
            COMMIT=$(echo "Kawish e-paper (aakhri ${KEEP_DAYS:-7} din)" | git commit-tree "$TREE")
            unset GIT_INDEX_FILE
            git push -q -f origin "$COMMIT:refs/heads/kawish-epaper"
            echo "e-paper saved: $(ls /tmp/ep)"
          fi
