name: FB post delete

on:
  workflow_dispatch:
    inputs:
      match:
        description: "Post ke matn ka hissa (sirf ek post mile to delete)"
        required: true

permissions:
  contents: write

jobs:
  del:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests
      - run: python tools/fb_delete.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MATCH: ${{ github.event.inputs.match }}
      - name: Nateeja branch par
        run: |
          git config user.name "nf-bot"; git config user.email "nf-bot@users.noreply.github.com"
          export GIT_INDEX_FILE=/tmp/idx
          git --work-tree=out add -A
          c=$(git commit-tree $(git write-tree) -m "fb delete")
          git push -f origin $c:refs/heads/fb-delete
