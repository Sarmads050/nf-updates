name: Telegram listener

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tg-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests
      - name: Clicks ka foran jawab (bot.py khud dobara chalata hai)
        run: |
          git config user.name "nf-bot"; git config user.email "nf-bot@users.noreply.github.com"
          ( while true; do sleep 120; [ -f /tmp/listener_log.txt ] || continue; mkdir -p /tmp/ll; cp /tmp/listener_log.txt /tmp/ll/;
            c=$(GIT_INDEX_FILE=/tmp/llidx sh -c 'git --work-tree=/tmp/ll add -A && git commit-tree $(git write-tree) -m log');
            git push -q -f origin $c:refs/heads/listener-log || true; done ) &
          python tools/tg_listener.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
